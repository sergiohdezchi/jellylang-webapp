name: jellylang

x-api: &api
  build:
    context: ./api
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  env_file: .env
  environment:
    DB_HOST: db
    REDIS_URL: redis://redis:6379/0
    # false = el servidor no usa yt-dlp; YouTube se importa solo con la extensión del navegador
    YTDLP_ENABLED: ${YTDLP_ENABLED:-true}
    # Correo: por defecto va a Mailpit (http://localhost:8025). Para probar Zoho, define SMTP_* en .env.
    SMTP_ADDRESS: ${SMTP_ADDRESS:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    APP_URL: ${APP_URL:-http://localhost:5173}
  volumes:
    - ./api:/rails
    - bundle_cache:/usr/local/bundle
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-jellylang}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jellylang}
      POSTGRES_DB: jellylang_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sin puertos publicados para no chocar con un PostgreSQL local.
    # Descomenta para conectarte desde el host:
    # ports:
    #   - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jellylang}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Recoge todo el correo que envía la app y lo muestra en http://localhost:8025 (no sale nada a internet)
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    <<: *api
    command: bin/rails server -b 0.0.0.0 -p 3000
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/up"]
      interval: 10s
      start_period: 60s
      retries: 10

  worker:
    <<: *api
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
    # npm install mantiene sincronizado el volumen de node_modules si cambia package.json
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
  web_node_modules:
