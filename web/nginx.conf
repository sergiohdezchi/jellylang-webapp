server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El DNS de Docker resuelve el nombre de la API al hacer cada petición (no al arrancar nginx).
    resolver 127.0.0.11 valid=10s;

    # Subtítulos y artículos importados pueden pesar varios MB
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        set $api http://jellylang-api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Archivos con hash en el nombre: caché de un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html (sin caché, para ver siempre la última versión)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
